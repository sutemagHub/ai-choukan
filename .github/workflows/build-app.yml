name: Build Android app

on:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - '.github/workflows/build-app.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build APK
        run: gradle -p android assembleDebug --no-daemon --stacktrace

      - name: Name the APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk ai-choukan.apk

      - name: Publish to the app release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: app-latest
          name: 生成AI朝刊 Androidアプリ
          body: |
            スマホでこのページを開き、下の ai-choukan.apk をタップしてダウンロード・インストールしてください。
            ビルド番号: ${{ github.run_number }}
          files: ai-choukan.apk
          make_latest: true
