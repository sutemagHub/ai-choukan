plugins {
    id 'com.android.application'
}

android {
    namespace 'jp.sutemag.aichoukan'
    compileSdk 34

    defaultConfig {
        applicationId 'jp.sutemag.aichoukan'
        minSdk 26
        targetSdk 34
        // Each GitHub Actions build gets a higher number so the new APK installs over the old one.
        versionCode Integer.parseInt(System.getenv('GITHUB_RUN_NUMBER') ?: '1')
        versionName "1.0." + (System.getenv('GITHUB_RUN_NUMBER') ?: '0')
    }

    signingConfigs {
        // A fixed key kept in the repo, so every build is signed the same way and updates install cleanly.
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
